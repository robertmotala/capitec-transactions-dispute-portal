services:
  postgres: { image: postgres:16-alpine, environment: { POSTGRES_DB: disputes, POSTGRES_USER: disputes, POSTGRES_PASSWORD: disputes }, ports: ["5432:5432"], healthcheck: { test: ["CMD-SHELL","pg_isready -U disputes"], interval: 5s, timeout: 3s, retries: 10 } }
  keycloak: { image: quay.io/keycloak/keycloak:24.0.5, command: start-dev --import-realm, environment: { KEYCLOAK_ADMIN: admin, KEYCLOAK_ADMIN_PASSWORD: admin }, ports: ["8081:8080"], volumes: ["./infra/keycloak:/opt/keycloak/data/import"] }
  api: { build: ., restart: on-failure, environment: { DB_URL: jdbc:postgresql://postgres:5432/disputes, DB_USER: disputes, DB_PASSWORD: disputes, OAUTH_TOKEN_URI: http://keycloak:8080/realms/disputes/protocol/openid-connect/token, OAUTH_JWK_SET_URI: http://keycloak:8080/realms/disputes/protocol/openid-connect/certs }, ports: ["8080:8080"], depends_on: { postgres: { condition: service_healthy }, keycloak: { condition: service_started } } }
